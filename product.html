<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | My Site</title>
<link rel="stylesheet" href="style.css">
<script src="tracker.js"></script>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="dot"></span>My Site</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html" class="active">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <p><a href="products.html">&larr; Back to products</a></p>
  <div id="product-detail">
    <p class="subtitle">Loading product…</p>
  </div>
</main>

<footer>
  &copy; 2026 My Site. Built with GitHub Pages.
</footer>

<script src="products-data.js"></script>
<script>
  function formatPrice(value, currency) {
    try {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: currency }).format(value);
    } catch (e) {
      return value + " " + currency;
    }
  }

  var params = new URLSearchParams(location.search);
  var id = params.get("id");
  var product = PRODUCTS.find(function (p) { return p.id === id; });
  var container = document.getElementById("product-detail");

  if (!product) {
    container.innerHTML =
      '<div class="left-bar"><h1>Product not found</h1>' +
      '<p>No product matches id "' + (id || "") + '". <a href="products.html">See all products</a>.</p></div>';
  } else {
    document.title = product.name + " | My Site";

    var priceHtml = product.discounted_price
      ? '<span class="product-price-old">' + formatPrice(product.price, product.currency) + '</span> ' +
        '<span class="product-price">' + formatPrice(product.discounted_price, product.currency) + '</span>'
      : '<span class="product-price">' + formatPrice(product.price, product.currency) + '</span>';

    container.innerHTML =
      '<div class="product-detail-grid">' +
        '<img class="product-detail-img" src="' + product.image_url + '" alt="' + product.name + '">' +
        '<div class="left-bar">' +
          '<span class="tag">' + product.category + '</span>' +
          '<h1>' + product.name + '</h1>' +
          '<div class="product-price-row">' + priceHtml + '</div>' +
          '<p>' + product.description + '</p>' +
          '<p>' + (product.in_stock ? '<span class="product-in-stock">In stock</span>' : '<span class="product-oos">Out of stock</span>') + '</p>' +
        '</div>' +
      '</div>';

    // ---- Brevo page event, enriched with product properties ----
    // Brevo.push(["page", page_name, properties])
    // https://developers.brevo.com/docs/track-page-views-js
    window.Brevo = window.Brevo || [];
    Brevo.push([
      "page",
      "Product: " + product.name, // unique per product so each view is logged distinctly
      {
        page_url: location.href,
        page_type: "product",
        product_id: product.id,
        product_name: product.name,
        product_price: product.price,
        product_currency: product.currency,
        product_image_url: product.image_url,
        product_category: product.category,
        product_discounted_price: product.discounted_price,
        product_in_stock: product.in_stock,
      },
    ]);
  }
</script>

<script src="ext-id-switcher.js"></script>
</body>
</html>
