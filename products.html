<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products | My Site</title>
<link rel="stylesheet" href="style.css">
<script src="tracker.js"></script>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span class="dot"></span>My Site</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html" class="active">Products</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <div class="left-bar">
    <span class="tag">Products</span>
    <h1>Our products</h1>
    <p class="subtitle">A small test catalog — click a product to see its detail page.</p>
  </div>

  <div class="product-grid" id="product-grid"></div>
</main>

<footer>
  &copy; 2026 My Site. Built with GitHub Pages.
</footer>

<script src="products-data.js"></script>
<script>
  function formatPrice(value, currency) {
    try {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: currency }).format(value);
    } catch (e) {
      return value + " " + currency;
    }
  }

  var grid = document.getElementById("product-grid");
  PRODUCTS.forEach(function (p) {
    var card = document.createElement("a");
    card.className = "product-card";
    card.href = "product.html?id=" + encodeURIComponent(p.id);

    var priceHtml = p.discounted_price
      ? '<span class="product-price-old">' + formatPrice(p.price, p.currency) + '</span> ' +
        '<span class="product-price">' + formatPrice(p.discounted_price, p.currency) + '</span>'
      : '<span class="product-price">' + formatPrice(p.price, p.currency) + '</span>';

    card.innerHTML =
      '<img class="product-card-img" src="' + p.image_url + '" alt="' + p.name + '">' +
      '<div class="product-card-body">' +
        '<span class="tag">' + p.category + '</span>' +
        '<h3>' + p.name + '</h3>' +
        '<div class="product-price-row">' + priceHtml + '</div>' +
        (p.in_stock ? '' : '<span class="product-oos">Out of stock</span>') +
      '</div>';
    grid.appendChild(card);
  });
</script>

<script src="ext-id-switcher.js"></script>
</body>
</html>
